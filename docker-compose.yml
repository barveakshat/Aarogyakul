services:
  # Local Postgres — only starts with: docker compose --profile local up
  postgres:
    profiles: [local]
    image: postgres:17-alpine
    container_name: aarogyakul-db
    environment:
      POSTGRES_DB:       aarogyakul
      POSTGRES_USER:     aarogyakul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aarogyakul -d aarogyakul"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./aarogyakul-backend
      dockerfile: Dockerfile
    container_name: aarogyakul-backend
    environment:
      DATABASE_URL:          ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_USERNAME:     ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_PASSWORD:     ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      JWT_SECRET:            ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_HOURS:      ${JWT_EXPIRY_HOURS:-24}
      SERVER_CORS_ORIGIN:    ${SERVER_CORS_ORIGIN:-http://localhost}
      STORAGE_MODE:          ${STORAGE_MODE:-local}
      LOCAL_STORAGE_DIR:     /app/uploads
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET_NAME:    ${AWS_S3_BUCKET_NAME:-}
      AWS_REGION:            ${AWS_REGION:-ap-south-1}
      HUGGINGFACE_API_URL:   ${HUGGINGFACE_API_URL:-https://router.huggingface.co/v1/chat/completions}
      HUGGINGFACE_API_KEY:   ${HUGGINGFACE_API_KEY:-}
      LLAMA_MODEL_NAME:      ${LLAMA_MODEL_NAME:-meta-llama/Llama-3.1-8B-Instruct}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./aarogyakul-frontend
      dockerfile: Dockerfile
    container_name: aarogyakul-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
